<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Learning 第 5 章 · 机器学习基础 — 动画讲解</title>
<!--
  Animated walkthrough of Chapter 5 ("Machine Learning Basics") of
  Goodfellow, Bengio & Courville, Deep Learning (deeplearningbook.org).

  Open this file in Chrome. 14 scenes cover §5.1–§5.11; every curve is computed
  live (polynomial fits, bias/variance over resampled data sets, logistic
  regression by gradient descent, k-means, SGD), not drawn by hand.

  Deep links: #s=<scene>&k=<caption>&f=<0..1> opens paused at that point.
  #selftest draws every scene at many points and reports errors in the page.
-->
<style>
  :root {
    --bg:        #0f1115;
    --panel:     #171a21;
    --panel-2:   #1e222b;
    --line:      #2a2f3a;
    --ink:       #e6e8ee;
    --ink-dim:   #939aab;
    --accent:    #6aa9ff;
    --evict:     #e2607a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 24px 60px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); margin: 0 0 16px; }
  .sub kbd {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  canvas {
    display: block; width: 100%; aspect-ratio: 16 / 9;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-top: 12px;
  }
  button, select {
    font: 600 13px/1 inherit; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 7px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--evict); color: var(--evict); }
  label { color: var(--ink-dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .bar { flex: 1; min-width: 160px; height: 8px; background: var(--panel-2); border-radius: 4px; position: relative; cursor: pointer; }
  .bar > div { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 4px; }
  .time { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); min-width: 96px; text-align: right; }
  .chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chapters button { font-weight: 500; font-size: 12px; padding: 6px 10px; }
  .chapters button.cur { border-color: var(--accent); color: var(--accent); }
  #err { color: var(--evict); font-family: var(--mono); white-space: pre-wrap; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Deep Learning 第 5 章 · 机器学习基础</h1>
  <p class="sub">
    14 个动画场景讲完 §5.1–§5.11。<kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd> <kbd>→</kbd> 上/下一个场景 ·
    <kbd>,</kbd> <kbd>.</kbd> 上/下一句字幕。勾选“朗读”用浏览器的中文语音配音；
    “录制 .webm”会从头播放一遍并下载视频文件（录制里没有配音，字幕在画面里）。
  </p>
  <canvas id="screen"></canvas>
  <div class="controls">
    <button id="prev" title="上一个场景">⏮</button>
    <button id="play">▶ 播放</button>
    <button id="next" title="下一个场景">⏭</button>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
    <label><input type="checkbox" id="narrate"> 朗读</label>
    <button id="rec">⏺ 录制 .webm</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <div id="err"></div>
</div>

<script>
'use strict';

// ===================================================================
// canvas + palette
// ===================================================================
const W = 1280, H = 720;
const C = {
  bg: '#0f1115', panel: '#171a21', panel2: '#1e222b', line: '#2a2f3a',
  ink: '#e6e8ee', dim: '#939aab',
  accent: '#6aa9ff', hit: '#4bbf87', evict: '#e2607a', warm: '#e8b04b', violet: '#b197fc',
};
const FONT = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace';

const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR;
cv.height = H * DPR;

// ===================================================================
// math helpers
// ===================================================================
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const seg = (p, i) => clamp(p - i, 0, 1);            // progress through caption i
const fade = (p, i, d = 0.25) => ease((p - i) / d);  // fade in at the start of caption i
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const sigmoid = z => 1 / (1 + Math.exp(-z));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  let u = 0;
  while (!u) u = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r());
}

// Gaussian elimination with partial pivoting.
function solve(A, b) {
  const n = b.length;
  A = A.map(r => r.slice()); b = b.slice();
  for (let i = 0; i < n; i++) {
    let m = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    for (let r = i + 1; r < n; r++) {
      const f = A[r][i] / A[i][i];
      for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = b[i];
    for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
    x[i] = s / A[i][i];
  }
  return x;
}

// Ridge-regularised least squares on features 1, x, …, x^d (the bias is not penalised).
function polyfit(xs, ys, d, lam) {
  const n = d + 1;
  const A = range(n, () => new Array(n).fill(0)), b = new Array(n).fill(0);
  xs.forEach((x, i) => {
    const phi = range(n, k => x ** k);
    for (let r = 0; r < n; r++) {
      b[r] += phi[r] * ys[i];
      for (let c = 0; c < n; c++) A[r][c] += phi[r] * phi[c];
    }
  });
  for (let k = 1; k < n; k++) A[k][k] += lam;
  return solve(A, b);
}
const polyval = (c, x) => { let s = 0, xp = 1; for (const w of c) { s += w * xp; xp *= x; } return s; };
const mse = (c, xs, ys) => mean(xs.map((x, i) => (polyval(c, x) - ys[i]) ** 2));

// ===================================================================
// drawing helpers
// ===================================================================
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 400} ${o.size || 20}px ${o.mono ? MONO : FONT}`;
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function withAlpha(a, fn) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore();
}
function panel(x, y, w, h, title, border) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12);
  ctx.fillStyle = C.panel; ctx.fill();
  ctx.strokeStyle = border || C.line; ctx.lineWidth = border ? 2 : 1; ctx.stroke();
  ctx.restore();
  if (title) txt(title, x + 16, y + 28, { size: 17, color: C.dim, weight: 600 });
}
function line(x1, y1, x2, y2, color, width = 2, dash) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function arrow(x1, y1, x2, y2, color, width = 2.5) {
  line(x1, y1, x2, y2, color, width);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 11;
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - s * Math.cos(a - 0.4), y2 - s * Math.sin(a - 0.4));
  ctx.lineTo(x2 - s * Math.cos(a + 0.4), y2 - s * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x, y, r, color) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function box(x, y, w, h, color, r = 6) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.restore();
}
function outline(x, y, w, h, color, r = 8, width = 2) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke(); ctx.restore();
}
function rows(list, x, y, gap, o) { list.forEach((s, i) => txt(s, x, y + i * gap, o)); }
function legend(items, x, y) {
  let cx = x;
  for (const [color, label, kind] of items) {
    if (kind === 'line') line(cx, y - 6, cx + 22, y - 6, color, 3, [6, 5]);
    else dot(cx + 8, y - 6, 6, color);
    txt(label, cx + 30, y, { size: 15, color: C.dim });
    ctx.font = `15px ${FONT}`;
    cx += 30 + ctx.measureText(label).width + 26;
  }
}

class Plot {
  constructor(x, y, w, h, xr, yr) { Object.assign(this, { x, y, w, h, xr, yr }); }
  X(v) { return this.x + (v - this.xr[0]) / (this.xr[1] - this.xr[0]) * this.w; }
  Y(v) { return this.y + this.h - (v - this.yr[0]) / (this.yr[1] - this.yr[0]) * this.h; }
  axes(o = {}) {
    const y0 = this.yr[0] <= 0 && this.yr[1] >= 0 ? this.Y(0) : this.y + this.h;
    const x0 = this.xr[0] <= 0 && this.xr[1] >= 0 ? this.X(0) : this.x;
    line(this.x, y0, this.x + this.w, y0, C.line, 1.5);
    line(x0, this.y, x0, this.y + this.h, C.line, 1.5);
    if (o.xl) txt(o.xl, this.x + this.w, y0 + 22, { size: 15, color: C.dim, align: 'right' });
    if (o.yl) txt(o.yl, x0 + 8, this.y + 14, { size: 15, color: C.dim });
  }
  clip(fn) {
    ctx.save(); ctx.beginPath(); ctx.rect(this.x, this.y, this.w, this.h); ctx.clip(); fn(); ctx.restore();
  }
  fn(f, o = {}) {
    const span = this.yr[1] - this.yr[0];
    this.clip(() => {
      ctx.strokeStyle = o.color || C.hit; ctx.lineWidth = o.width || 3;
      ctx.globalAlpha *= o.alpha ?? 1;
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.beginPath();
      const a = o.from ?? this.xr[0], b = o.to ?? this.xr[1], n = o.n || 240;
      for (let i = 0; i <= n; i++) {
        const v = a + (b - a) * i / n;
        const py = this.Y(clamp(f(v), this.yr[0] - 3 * span, this.yr[1] + 3 * span));
        i ? ctx.lineTo(this.X(v), py) : ctx.moveTo(this.X(v), py);
      }
      ctx.stroke();
    });
  }
  poly(pts, o = {}) {
    if (pts.length < 2) return;
    this.clip(() => {
      ctx.strokeStyle = o.color || C.hit; ctx.lineWidth = o.width || 3;
      ctx.globalAlpha *= o.alpha ?? 1;
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.beginPath();
      pts.forEach(([u, v], i) => i ? ctx.lineTo(this.X(u), this.Y(v)) : ctx.moveTo(this.X(u), this.Y(v)));
      ctx.stroke();
    });
  }
  dots(xs, ys, o = {}) {
    const n = o.count ?? xs.length;
    withAlpha(o.alpha ?? 1, () => {
      for (let i = 0; i < n; i++) dot(this.X(xs[i]), this.Y(ys[i]), o.r || 6, o.color || C.accent);
    });
  }
  // Fill cells by class probability: blue for class 1, red for class 0.
  shade(prob, nx = 40, ny = 30) {
    const cw = this.w / nx, ch = this.h / ny;
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      const x = this.xr[0] + (i + 0.5) / nx * (this.xr[1] - this.xr[0]);
      const y = this.yr[1] - (j + 0.5) / ny * (this.yr[1] - this.yr[0]);
      const q = prob(x, y, i, j);
      ctx.fillStyle = q >= 0.5 ? `rgba(106,169,255,${(q - 0.5) * 0.7})` : `rgba(226,96,122,${(0.5 - q) * 0.7})`;
      ctx.fillRect(this.x + i * cw, this.y + j * ch, cw + 0.6, ch + 0.6);
    }
  }
}

// ===================================================================
// data (seeded so every run looks the same)
// ===================================================================
const truef = x => Math.sin(Math.PI * x);

// §5.1 linear regression trained by gradient descent
const rL = mulberry32(1);
const LX = range(16, () => 0.05 + 0.95 * rL());
const LY = LX.map(x => 2 * x + 0.5 + 0.18 * gauss(rL));
const GD = [];
{
  let w = -0.5, b = 1.6;
  for (let s = 0; s < 80; s++) {
    let gw = 0, gb = 0, e2 = 0;
    LX.forEach((x, i) => { const e = w * x + b - LY[i]; gw += 2 * e * x; gb += 2 * e; e2 += e * e; });
    GD.push({ w, b, mse: e2 / LX.length });
    w -= 0.6 * gw / LX.length; b -= 0.6 * gb / LX.length;
  }
}

// §5.2 polynomial capacity: 12 training points, 80 test points
const rC = mulberry32(5);
const TX = range(12, i => -0.95 + 1.9 * i / 11 + (rC() - 0.5) * 0.08);
const TY = TX.map(x => truef(x) + 0.25 * gauss(rC));
const VX = range(80, () => rC() * 2 - 1);
const VY = VX.map(x => truef(x) + 0.25 * gauss(rC));
const FIT = range(10, d => polyfit(TX, TY, d, 1e-9));
const ERR = FIT.map(c => ({ train: mse(c, TX, TY), test: mse(c, VX, VY) }));
const BEST_D = ERR.reduce((bi, e, i) => e.test < ERR[bi].test ? i : bi, 0);

// §5.4 bias/variance: fixed x, noise resampled for 30 data sets
const BVX = range(12, i => -0.95 + 1.9 * i / 11);
const BVD = range(30, s => { const r = mulberry32(100 + s); return BVX.map(x => truef(x) + 0.25 * gauss(r)); });
const BVFIT = range(10, d => BVD.map(y => polyfit(BVX, y, d, 1e-9)));
const BVSTAT = BVFIT.map(fits => {
  const grid = range(41, i => -0.9 + 1.8 * i / 40);
  let b2 = 0, va = 0;
  for (const x of grid) {
    const ps = fits.map(c => polyval(c, x)), m = mean(ps);
    b2 += (m - truef(x)) ** 2;
    va += mean(ps.map(v => (v - m) ** 2));
  }
  return { bias2: b2 / grid.length, variance: va / grid.length };
});

// §5.5 MLE for the mean of N(μ, 1)
const rM = mulberry32(7);
const MX = range(8, () => 1.2 + gauss(rM));
const MX_BAR = mean(MX);
const logLik = mu => MX.reduce((s, x) => s - 0.5 * (x - mu) ** 2 - 0.5 * Math.log(2 * Math.PI), 0);

// §5.6 Bayesian update of θ with prior N(0, 1) and data ~ N(1.5, 1)
const rB = mulberry32(8);
const BX = range(60, () => 1.5 + gauss(rB));

// §5.7 logistic regression on two blobs, then a ring that no line can split
const rS = mulberry32(11);
const BLOBS = [];
for (let i = 0; i < 40; i++) {
  BLOBS.push([-0.8 + 0.6 * gauss(rS), -0.4 + 0.6 * gauss(rS), 0]);
  BLOBS.push([0.8 + 0.6 * gauss(rS), 0.5 + 0.6 * gauss(rS), 1]);
}
function trainLogistic(pts, steps, lr, w0) {
  let [a, b, c] = w0;
  const out = [];
  for (let s = 0; s <= steps; s++) {
    let ga = 0, gb = 0, gc = 0, nll = 0;
    for (const [x, y, k] of pts) {
      const q = sigmoid(a * x + b * y + c), e = q - k;
      ga += e * x; gb += e * y; gc += e;
      nll -= Math.log(k ? Math.max(q, 1e-12) : Math.max(1 - q, 1e-12));
    }
    out.push({ a, b, c, loss: nll / pts.length });
    a -= lr * ga / pts.length; b -= lr * gb / pts.length; c -= lr * gc / pts.length;
  }
  return out;
}
const LOGI = trainLogistic(BLOBS, 150, 1.0, [-1.2, 1.4, 0.8]);
const accOf = (pts, prob) => mean(pts.map(([x, y, k]) => (prob(x, y) >= 0.5) === (k === 1) ? 1 : 0));

const rRing = mulberry32(12);
const RING = [];
for (let i = 0; i < 70; i++) {
  const a1 = rRing() * 2 * Math.PI, r1 = 0.55 + 0.18 * gauss(rRing);
  RING.push([r1 * Math.cos(a1), r1 * Math.sin(a1), 1]);
  const a2 = rRing() * 2 * Math.PI, r2 = 1.45 + 0.2 * gauss(rRing);
  RING.push([r2 * Math.cos(a2), r2 * Math.sin(a2), 0]);
}
const RING_LR = trainLogistic(RING, 300, 1.0, [0, 0, 0]).pop();
const ringLR = (x, y) => sigmoid(RING_LR.a * x + RING_LR.b * y + RING_LR.c);
function knnProb(pts, k, x, y) {
  const d = pts.map(([u, v, c]) => [(u - x) ** 2 + (v - y) ** 2, c]).sort((p, q) => p[0] - q[0]);
  return mean(d.slice(0, k).map(p => p[1]));
}
function buildTree(pts, depth) {
  const n = pts.length, ones = pts.filter(p => p[2]).length;
  if (depth === 0 || ones === 0 || ones === n) return { v: ones / n };
  const gini = q => 2 * q * (1 - q);
  let best = null;
  for (const d of [0, 1]) {
    const s = [...pts].sort((p, q) => p[d] - q[d]);
    let l1 = 0;
    for (let i = 1; i < n; i++) {
      l1 += s[i - 1][2];
      if (s[i][d] === s[i - 1][d]) continue;
      const g = i * gini(l1 / i) + (n - i) * gini((ones - l1) / (n - i));
      if (!best || g < best.g) best = { g, d, t: (s[i][d] + s[i - 1][d]) / 2 };
    }
  }
  return {
    d: best.d, t: best.t,
    l: buildTree(pts.filter(p => p[best.d] < best.t), depth - 1),
    r: buildTree(pts.filter(p => p[best.d] >= best.t), depth - 1),
  };
}
const TREE = buildTree(RING, 4);
const treeProb = (x, y) => { let n = TREE; while (n.v === undefined) n = [x, y][n.d] < n.t ? n.l : n.r; return n.v; };
// kNN per cell is too slow to redo every frame, so cache the 36×36 grid once.
const RING_N = 36, RING_R = 2.2;
const KNN_GRID = [];
for (let i = 0; i < RING_N; i++) for (let j = 0; j < RING_N; j++) {
  const x = -RING_R + (i + 0.5) / RING_N * 2 * RING_R, y = RING_R - (j + 0.5) / RING_N * 2 * RING_R;
  KNN_GRID.push(knnProb(RING, 5, x, y));
}
const RING_ACC = [accOf(RING, ringLR), accOf(RING, (x, y) => knnProb(RING, 5, x, y)), accOf(RING, treeProb)];

// §5.8 PCA cloud and k-means
const rP = mulberry32(13);
const PCA_PTS = range(120, () => {
  const u = 1.2 * gauss(rP), v = 0.35 * gauss(rP), a = 0.5;
  return [u * Math.cos(a) - v * Math.sin(a), u * Math.sin(a) + v * Math.cos(a)];
});
const PCA = (() => {
  const mx = mean(PCA_PTS.map(p => p[0])), my = mean(PCA_PTS.map(p => p[1]));
  const a = mean(PCA_PTS.map(p => (p[0] - mx) ** 2)), c = mean(PCA_PTS.map(p => (p[1] - my) ** 2));
  const b = mean(PCA_PTS.map(p => (p[0] - mx) * (p[1] - my)));
  const h = Math.sqrt(((a - c) / 2) ** 2 + b * b), phi = 0.5 * Math.atan2(2 * b, a - c);
  return { mx, my, l1: (a + c) / 2 + h, l2: (a + c) / 2 - h, d1: [Math.cos(phi), Math.sin(phi)], d2: [-Math.sin(phi), Math.cos(phi)] };
})();

const rK = mulberry32(14);
const KM_PTS = [];
for (const [cx, cy] of [[-1.5, 1], [1.5, 1.2], [0, -1.3]]) {
  for (let i = 0; i < 45; i++) KM_PTS.push([cx + 0.45 * gauss(rK), cy + 0.45 * gauss(rK)]);
}
const KM_C = [[[-2.4, -1.9], [-1.9, -2.2], [2.5, 2.1]]], KM_A = [null];
for (let it = 0; it < 10; it++) {
  const c = KM_C[KM_C.length - 1];
  const a = KM_PTS.map(([x, y]) => {
    let bi = 0, bd = Infinity;
    c.forEach(([u, v], k) => { const d = (x - u) ** 2 + (y - v) ** 2; if (d < bd) { bd = d; bi = k; } });
    return bi;
  });
  const nc = c.map((old, k) => {
    const m = KM_PTS.filter((_, i) => a[i] === k);
    return m.length ? [mean(m.map(q => q[0])), mean(m.map(q => q[1]))] : old;
  });
  KM_A.push(a); KM_C.push(nc);
  if (nc.every((q, k) => Math.hypot(q[0] - c[k][0], q[1] - c[k][1]) < 1e-9)) break;
}

// §5.9 GD vs SGD on a rotated quadratic bowl (condition number 6)
const SA = 0.45, SC = Math.cos(SA), SS = Math.sin(SA), KAPPA = 6;
const toU = ([a, b]) => [SC * a + SS * b, -SS * a + SC * b];
const fromU = ([u, v]) => [SC * u - SS * v, SS * u + SC * v];
const bowlGrad = w => { const [u, v] = toU(w); return fromU([u, KAPPA * v]); };
const START = [-2.5, 1.3];
const GD_PATH = [START], SGD_PATH = [START];
{
  let w = START;
  for (let i = 0; i < 30; i++) { const g = bowlGrad(w); w = [w[0] - 0.3 * g[0], w[1] - 0.3 * g[1]]; GD_PATH.push(w); }
  const r = mulberry32(15);
  w = START;
  for (let i = 0; i < 70; i++) {
    const g = bowlGrad(w);
    w = [w[0] - 0.12 * (g[0] + 1.6 * gauss(r)), w[1] - 0.12 * (g[1] + 1.6 * gauss(r))];
    SGD_PATH.push(w);
  }
}

    '最大化似然，等价于让模型分布逼近数据的经验分布，也就是最小化 KL 散度，也就是最小化交叉熵。',
    '如果假设 y 等于预测值加高斯噪声，最大化条件似然恰好就是最小化 MSE。所以线性回归用 MSE 是有道理的。',
    'MLE 还有两个好性质：一致性（数据无穷多时收敛到真值）和统计效率高。这就是深度学习默认用它的原因。',
  ],

    const pdf = x => Math.exp(-0.5 * (x - mu) ** 2) / Math.sqrt(2 * Math.PI);

    panel(50, 84, 760, 262, '数据与模型分布 N(μ, 1)');

    panel(50, 358, 760, 238, '对数似然 log L(μ)');

    '先验 p(θ) 是看数据之前的信念，似然 p(x|θ) 是数据给出的证据。后验正比于似然乘以先验。',

    '数据少的时候差别明显：MAP 取后验的峰值，被先验拉向 0；MLE 只看数据。',

    const postMu = n * xbar / (1 + n), postSd = Math.sqrt(1 / (1 + n));

    panel(50, 84, 780, 512, 'θ 的分布（各自缩放到同一高度）');

      dot(pp.X(lerp(x, px, proj)), pp.Y(lerp(y, py, proj)), 4, C.accent);
    });

// ===================================================================
// captions
// ===================================================================
function wrap(s, maxW) {
  const toks = s.match(/[\x21-\x7e]+|\s+|[^\x21-\x7e\s]/g) || [];
  const out = [];
  let cur = '';
  for (const t of toks) {
    if (ctx.measureText(cur + t).width > maxW && cur.trim()) { out.push(cur.trim()); cur = t.trim() ? t : ''; }
    else cur += t;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function drawCaption(s) {
  ctx.save();
  let size = 25, lines;
  for (;;) {
    ctx.font = `500 ${size}px ${FONT}`;
    lines = wrap(s, 1130);
    if (lines.length <= 2 || size <= 20) break;
    size -= 1;
  }
  const lh = size * 1.45, h = lines.length * lh + 24, y0 = 706 - h;
  box(40, y0, 1200, h, 'rgba(23,26,33,0.94)', 12);
  ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + 12 + lh * (i + 0.5)));
  ctx.restore();
}

// ===================================================================
// player
// ===================================================================
const $ = id => document.getElementById(id);
let S = 0, K = 0, t = 0, playing = false, speed = 1, narrate = false;
let ttsDone = false, tDone = null, fracAtDone = 0, utter = null, zhVoice = null, last = performance.now();
let recorder = null, chunks = [];

const cap = () => SCENES[S].caps[K];
function est(s) {
  let w = 0;
  for (const ch of s) w += /[㐀-鿿　-〿＀-￯]/.test(ch) ? 1 : 0.45;
  return Math.max(3, w * 0.24 + 0.8);
}
function frac() {
  const e = est(cap());
  if (!narrate || !playing) return clamp(t / e, 0, 1);
  if (tDone === null) return Math.min(t / e, 0.98);
  return lerp(fracAtDone, 1, clamp((t - tDone) / 0.5, 0, 1));
}

const hasTTS = 'speechSynthesis' in window;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang) && /Tingting|Ting-Ting|婷婷/.test(v.name))
    || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (hasTTS) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
const SPEAK = [[/⇔/g, '等价于'], [/⇒/g, '所以'], [/≈/g, '约等于'], [/∝/g, '正比于'], [/ᵀ/g, ' 转置 '], [/²/g, '平方'],
  [/θ̂/g, 'theta hat'], [/θ/g, 'theta'], [/λ/g, 'lambda'], [/→/g, '，'], [/−/g, '减'], [/[·（）()]/g, ' ']];
function speak() {
  ttsDone = false; tDone = null;
  if (!hasTTS) return;
  speechSynthesis.cancel();
  if (!narrate || !playing) return;
  const u = new SpeechSynthesisUtterance(SPEAK.reduce((s, [re, r]) => s.replace(re, r), cap()));
  u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = speed;
  u.onend = u.onerror = () => { if (u === utter) ttsDone = true; };
  utter = u;
  speechSynthesis.speak(u);
}

function go(s, k) {
  S = clamp(s, 0, SCENES.length - 1);
  K = clamp(k, 0, SCENES[S].caps.length - 1);
  t = 0;
  speak();
  updateUI();
}
function advance() {
  if (K + 1 < SCENES[S].caps.length) go(S, K + 1);
  else if (S + 1 < SCENES.length) go(S + 1, 0);
  else { t = est(cap()); setPlaying(false); stopRecording(); }
}
function back() {
  if (K > 0) go(S, K - 1);
  else if (S > 0) go(S - 1, SCENES[S - 1].caps.length - 1);
}
function setPlaying(on) {
  playing = on;
  if (on) { if (t >= est(cap())) t = 0; if (narrate) t = 0; speak(); }
  else if (hasTTS) speechSynthesis.cancel();
  updateUI();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const sc = SCENES[S];
  if (!sc.noHeader) {
    txt(sc.title, 50, 60, { size: 28, weight: 700 });
    txt(sc.sec, W - 50, 60, { size: 18, color: C.dim, align: 'right', mono: true });
  }
  ctx.save(); sc.draw(K + frac()); ctx.restore();
  drawCaption(cap());
  SCENES.forEach((_, i) => dot(W / 2 - (SCENES.length - 1) * 8 + i * 16, 22, i === S ? 4.5 : 3, i === S ? C.accent : C.line));
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) {
    t += dt * speed;
    const e = est(cap());
    if (narrate) {
      if (ttsDone && tDone === null) { tDone = t; fracAtDone = Math.min(t / e, 0.98); }
      if (tDone !== null && t - tDone >= 0.5) advance();
    } else if (t >= e) advance();
  }
  render();
  updateProgress();
  requestAnimationFrame(tick);
}

// ---------- UI ----------
const FLAT = SCENES.flatMap((sc, s) => sc.caps.map((c, k) => ({ s, k, d: est(c) })));
const TOTAL = FLAT.reduce((a, c) => a + c.d, 0);
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
function elapsed() {
  let a = 0;
  for (const c of FLAT) { if (c.s === S && c.k === K) return a + Math.min(t, c.d); a += c.d; }
  return a;
}
function updateProgress() {
  const e = elapsed();
  $('fill').style.width = `${e / TOTAL * 100}%`;
  $('time').textContent = `${mmss(e / speed)} / ${mmss(TOTAL / speed)}`;
}
function updateUI() {
  $('play').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  $('rec').textContent = recorder ? '⏹ 停止录制' : '⏺ 录制 .webm';
  $('rec').classList.toggle('on', !!recorder);
  [...$('chapters').children].forEach((b, i) => b.classList.toggle('cur', i === S));
}
SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.textContent = `${i}. ${sc.title}`;
  b.onclick = () => go(i, 0);
  $('chapters').appendChild(b);
});
$('play').onclick = () => setPlaying(!playing);
$('prev').onclick = () => go(S - 1, 0);
$('next').onclick = () => go(S + 1, 0);
$('speed').onchange = e => { speed = +e.target.value; speak(); };
$('narrate').onchange = e => { narrate = e.target.checked; t = 0; speak(); };
if (!hasTTS) $('narrate').disabled = true;
$('bar').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect(), target = (e.clientX - r.left) / r.width * TOTAL;
  let a = 0;
  for (const c of FLAT) { if (a + c.d > target) { go(c.s, c.k); t = target - a; return; } a += c.d; }
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') go(S + 1, 0);
  else if (e.key === 'ArrowLeft') go(S - 1, 0);
  else if (e.key === '.') advance();
  else if (e.key === ',') back();
});

// ---------- recording ----------
function stopRecording() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
$('rec').onclick = () => {
  if (recorder) { setPlaying(false); stopRecording(); return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8e6 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'dl_ch5_ml_basics.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    recorder = null;
    updateUI();
  };
  narrate = false; $('narrate').checked = false;
  go(0, 0);
  recorder.start(1000);
  setPlaying(true);
};

// ---------- deep links + self-test ----------
function selftest() {
  const errs = [];
  SCENES.forEach((sc, i) => {
    for (let p = 0; p < sc.caps.length; p += 0.05) {
      try { ctx.save(); sc.draw(p); ctx.restore(); }
      catch (e) { ctx.restore(); errs.push(`scene ${i} p=${p.toFixed(2)}: ${e.message}`); break; }
    }
    sc.caps.forEach(c => drawCaption(c));
  });
  return errs;
}
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.has('selftest')) {
  const errs = selftest();
  $('err').textContent = errs.length ? errs.join('\n') : 'SELFTEST OK';
  document.title = errs.length ? 'SELFTEST FAIL' : 'SELFTEST OK';
}
if (hash.has('s')) {
  go(+hash.get('s'), +(hash.get('k') || 0));
  t = (+hash.get('f') || 0) * est(cap());
}
window.addEventListener('error', e => { $('err').textContent += `\n${e.message} (line ${e.lineno})`; });
updateUI();
requestAnimationFrame(tick);
</script>
</body>
